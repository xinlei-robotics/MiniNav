name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned rather than taken from the runner image: CMake 3.28 cannot import the
# installed C++ module interfaces the ROS 2 packages consume, and an image
# update to a new major version must not change the toolchain silently.
env:
  CMAKE_VERSION: 3.31.6

jobs:
  build-and-test:
    name: Build and Test (Clang 18, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    # Debug keeps -Werror; Release runs the wall-clock budget tests that are
    # skipped in Debug, and checks the golden baselines under optimization.
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: ci-debug
          - build_type: Release
            preset: ci-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            libstdc++-13-dev \
            libc++-18-dev \
            libc++abi-18-dev \
            ninja-build \
            libeigen3-dev

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        run: |
          base="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}"
          tarball="cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/cmake-${CMAKE_VERSION}-SHA-256.txt" | grep " ${tarball}\$" | sha256sum -c -
          sudo tar -xzf "${tarball}" -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain versions
        run: |
          /usr/bin/clang++-18 --version
          cmake --version | grep -F "cmake version ${CMAKE_VERSION}"
          ninja --version

      - name: Configure (${{ matrix.preset }} preset)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset test-${{ matrix.preset }}

      # golden_out holds the CSVs the regression tests produced on this runner;
      # diff them against tests/golden/ to see what changed.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build_type }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeError.log
            build/${{ matrix.preset }}/tests/golden_out/
          if-no-files-found: ignore