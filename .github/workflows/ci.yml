name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned rather than taken from the runner image: CMake 3.28 cannot import the
# installed C++ module interfaces the ROS 2 packages consume, and an image
# update to a new major version must not change the toolchain silently.
env:
  CMAKE_VERSION: 3.31.6

jobs:
  build-and-test:
    name: Build and Test (Clang 18, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    # Debug keeps -Werror; Release runs the wall-clock budget tests that are
    # skipped in Debug, and checks the golden baselines under optimization.
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: ci-debug
          - build_type: Release
            preset: ci-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            libstdc++-13-dev \
            libc++-18-dev \
            libc++abi-18-dev \
            ninja-build \
            libeigen3-dev

      - name: Set up CMake ${{ env.CMAKE_VERSION }}
        uses: ./.github/actions/setup-cmake
        with:
          version: ${{ env.CMAKE_VERSION }}

      - name: Verify toolchain versions
        run: |
          /usr/bin/clang++-18 --version
          cmake --version
          ninja --version

      - name: Configure (${{ matrix.preset }} preset)
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset build-${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset test-${{ matrix.preset }}

      # golden_out holds the CSVs the regression tests produced on this runner;
      # diff them against tests/golden/ to see what changed.
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build_type }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeOutput.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeError.log
            build/${{ matrix.preset }}/tests/golden_out/
          if-no-files-found: ignore

  # The ROS 2 workspace under ros/: the core built as the CMake package MiniNav and consumed by
  # ament packages. Runs in the official ROS image (apt on the bare-metal runner is flaky); every
  # other dependency comes from the package.xml files through rosdep, so a missing one fails here.
  ros2:
    name: ROS 2 Jazzy (colcon build + test)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            clang-18 \
            libstdc++-13-dev \
            ninja-build

      - name: Set up CMake ${{ env.CMAKE_VERSION }}
        uses: ./.github/actions/setup-cmake
        with:
          version: ${{ env.CMAKE_VERSION }}

      - name: Install package dependencies (rosdep)
        run: |
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros --ignore-src --rosdistro jazzy -y

      # ros/colcon_defaults.yaml sets Clang 18, Ninja and the build/colcon/ output tree.
      - name: Build
        working-directory: ros
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: Test
        working-directory: ros
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload colcon logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: |
            build/colcon/log/
            build/colcon/build/*/test_results/
          if-no-files-found: ignore
